  h1 { margin: 0 0 10px; font-size: 1.3rem; color: var(--rh); }
  .toolbar {
    background: var(--panel); padding: 12px 16px; border-radius: 12px; border: 1px solid #444;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    max-width: 1380px; width: 100%; box-sizing: border-box; margin-bottom: 12px;
  }
  .box { display: flex; gap: 6px; align-items: center; background: var(--card); padding: 6px 10px; border-radius: 8px; border: 1px solid #444; flex-wrap: wrap; }
  label { font-size: 0.84rem; color: #ccc; font-weight: bold; }
  select, input[type="file"], input[type="number"], input[type="text"], button {
    background: #3d3d4e; color: #fff; border: 1px solid #555; padding: 6px 9px; border-radius: 6px; font-size: 0.84rem; cursor: pointer;
  }
  input[type="text"] { cursor: text; width: 190px; border-color: var(--ok); }
  input[type="number"] { width: 52px; text-align: center; cursor: text; }
  input[type="number"].mini-num { width: 42px; padding: 5px 4px; }

  /* Menus déroulants de styles : plus grands et colorés par famille */
  select.style-cat {
    font-size: 1rem; padding: 9px 12px; min-width: 185px; font-weight: bold;
  }
  select.style-cat#cat-jazz { background: #4b2a6b; border: 2px solid #a86ee7; color: #f3e8ff; }
  select.style-cat#cat-pop  { background: #6e5a12; border: 2px solid #f1c40f; color: #fff9db; }
  select.style-cat#cat-latin{ background: #6e3f10; border: 2px solid #f39c12; color: #ffeedd; }
  select.style-cat#cat-trad { background: #1e5c34; border: 2px solid #2ecc71; color: #eafff3; }

  /* Panneau vertical des commandes de copie, à gauche des mesures */
  .main-row {
    display: flex; gap: 12px; align-items: flex-start;
    width: 100%; max-width: 1380px;
  }
  .copy-panel {
    background: var(--panel); border: 1px solid #444; border-radius: 10px;
    padding: 12px 10px; width: 165px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px; position: sticky; top: 12px;
  }
  .copy-panel .cp-title { font-weight: bold; color: var(--rh); font-size: 0.88rem; text-align: center; border-bottom: 1px solid #444; padding-bottom: 6px; }
  .copy-panel label { display: block; margin-bottom: 2px; font-size: 0.8rem; }
  .copy-panel input[type="number"] { width: 100%; box-sizing: border-box; }
  .copy-panel button { width: 100%; }
  @media (max-width: 900px) {
    .main-row { flex-direction: column-reverse; }
    .copy-panel { width: 100%; position: static; }
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: #007bff; border-color: #007bff; font-weight: bold; }
  button.success { background: #27ae60; border-color: #2ecc71; font-weight: bold; }
  button.danger { background: #c0392b; border-color: #e74c3c; font-weight: bold; }
  button.secondary { background: #4a4a5e; border-color: #666; }
  .active-style-badge {
    background: rgba(0, 210, 255, 0.15); border: 1px solid var(--rh); color: var(--rh);
    padding: 5px 10px; border-radius: 6px; font-size: 0.84rem; font-weight: bold;
  }
  #status { width: 100%; text-align: center; font-size: 0.88rem; color: #ffd166; font-weight: bold; margin-top: 4px; }
  
  /* Affichage forcé à 4 mesures par ligne */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  .m-card {
    background: var(--panel); border: 1px solid #444; border-radius: 10px; padding: 10px;
    display: flex; flex-direction: column; gap: 7px; transition: border-color 0.15s, box-shadow 0.15s;
    min-width: 0;
  }
  .m-card.playing { border-color: #007bff; background: #1450a3; box-shadow: 0 0 16px rgba(0, 123, 255, 0.75); }
  .m-card.playing .m-num { color: #ffffff; }
  .m-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 5px; }
  .m-num { font-weight: bold; color: var(--rh); font-size: 0.92rem; }
  .split-btns { display: flex; gap: 3px; }
  .split-btn { padding: 2px 7px; font-size: 0.74rem; background: #202028; border: 1px solid #555; }
  .split-btn.active { background: var(--chord); color: #000; font-weight: bold; border-color: #fff; }
  .slots { display: flex; flex-direction: column; gap: 5px; }
  .slot-row { display: flex; gap: 5px; align-items: center; background: var(--card); padding: 4px 7px; border-radius: 6px; }
  .slot-lbl { font-size: 0.74rem; color: #aaa; min-width: 42px; font-family: monospace; }
  .slot-row select { flex: 1; padding: 4px 5px; font-size: 0.82rem; min-width: 0; }
  .copy-btn { padding: 2px 6px; font-size: 0.72rem; background: #333; color: #bbb; }
</style>
</head>
<body>

<h1>Générateur MIDI 3 Pistes — Arrangeur Virtuel (v12)</h1>

<div class="toolbar">
  <div class="box">
    <label>1. Mélodie / MuseScore (.mid) :</label>
    <input type="file" id="midi-in" accept=".mid,.midi">
    <label>Nom fichier :</label>
    <input type="text" id="file-name" value="morceau_arrange" placeholder="Nom du fichier MIDI">
  </div>

  <div class="box">
    <label>🎷 Jazz :</label>
    <select class="style-cat" id="cat-jazz">
      <option value="">-- Choisir --</option>
      <option value="swing" selected>Swing</option>
      <option value="django">Django (Pompe)</option>
      <option value="jazz_waltz">Jazz Waltz (3/4)</option>
      <option value="shuffle">Shuffle</option>
      <option value="jazz_ballad">Jazz Ballad</option>
      <option value="boogie">Boogie</option>
      <option value="bebop">Bebop</option>
      <option value="blues">Blues</option>
      <option value="5_4_tern">5/4 Ternaire</option>
      <option value="7_4_tern">7/4 Ternaire</option>
      <option value="9_4_tern">9/4 Ternaire</option>
    </select>

    <label>🎸 Pop :</label>
    <select class="style-cat" id="cat-pop">
      <option value="">-- Choisir --</option>
      <option value="pop">Pop</option>
      <option value="rock">Rock</option>
      <option value="disco">Disco</option>
      <option value="rockabilly">Rockabilly</option>
      <option value="hiphop">Hip Hop</option>
      <option value="funk">Funk</option>
      <option value="slow">Slow</option>
      <option value="ballade">Ballade</option>
      <option value="campfire">Camp fire</option>
    </select>

    <label>🌴 Latin :</label>
    <select class="style-cat" id="cat-latin">
      <option value="">-- Choisir --</option>
      <option value="latin">Latin</option>
      <option value="bossa">Bossa</option>
      <option value="samba">Samba</option>
      <option value="cubain">Cubain (Montuno)</option>
      <option value="bolero">Boléro</option>
      <option value="cumbia">Cumbia</option>
      <option value="salsa">Salsa</option>
      <option value="merengue">Merengue</option>
      <option value="tango">Tango</option>
      <option value="reggae">Reggae</option>
      <option value="africain">Africain</option>
      <option value="chachacha">Cha-cha-cha</option>
      <option value="rumba">Rumba</option>
      <option value="biguine">Biguine</option>
      <option value="pasodoble">Paso-doble</option>
      <option value="zouk">Zouk</option>
    </select>

    <label>🪗 Traditionnel :</label>
    <select class="style-cat" id="cat-trad">
      <option value="">-- Choisir --</option>
      <option value="valse">Valse (3/4)</option>
      <option value="polka">Polka (2/4)</option>
      <option value="twostep">Two Step</option>
      <option value="klezmer">Klezmer</option>
      <option value="irish">Irish Ballad</option>
      <option value="6_8">6/8</option>
      <option value="5_8">5/8</option>
      <option value="7_8">7/8</option>
      <option value="9_8">9/8</option>
    </select>

    <span class="active-style-badge" id="active-style-lbl">Style : Swing</span>
  </div>

  <div class="box">
    <label>Mesures :</label>
    <input type="number" id="meas-count" min="1" max="64" value="8">
    <label>BPM :</label>
    <input type="number" id="bpm-input" min="40" max="240" value="110">
    <label>Signature :</label>
    <select id="sig-select">
      <option value="4/4" selected>4/4</option>
      <option value="3/4">3/4</option>
      <option value="2/4">2/4</option>
      <option value="6/8">6/8</option>
      <option value="5/8">5/8</option>
      <option value="7/8">7/8</option>
      <option value="9/8">9/8</option>
      <option value="5/4">5/4</option>
      <option value="7/4">7/4</option>
      <option value="9/4">9/4</option>
    </select>
  </div>

  <div class="box">
    <button id="btn-preview" class="primary" title="Raccourci : Barre d'espace">▶ Aperçu (Espace)</button>
    <button id="btn-stop" class="danger" disabled title="Raccourci : Barre d'espace">⏹ Stop</button>
    <button id="btn-export" class="success">💾 Exporter MIDI (Piano / Basse / Guitare)</button>
  </div>

  klezmer:     { name: 'Klezmer', sig: '4/4', b: 4, p: [{t:0,k:'b',d:.45},{t:.5,k:'c',d:.35},{t:1,k:'5',d:.45},{t:1.5,k:'c',d:.35},{t:2,k:'b',d:.45},{t:2.5,k:'c',d:.35},{t:3,k:'5',d:.45},{t:3.5,k:'c',d:.35}] },

  '6_8':       { name: '6/8', sig: '6/8', b: 3, p: [{t:0,k:'b',d:.9},{t:.5,k:'c',d:.4},{t:1,k:'c',d:.4},{t:1.5,k:'5',d:.9},{t:2,k:'c',d:.4},{t:2.5,k:'c',d:.4}] },
  '5_8':       { name: '5/8', sig: '5/8', b: 2.5, p: [{t:0,k:'b',d:.9},{t:.5,k:'c',d:.4},{t:1,k:'c',d:.4},{t:1.5,k:'5',d:.5},{t:2,k:'c',d:.4}] },
  '7_8':       { name: '7/8', sig: '7/8', b: 3.5, p: [{t:0,k:'b',d:.9},{t:.5,k:'c',d:.4},{t:1,k:'c',d:.4},{t:1.5,k:'5',d:.5},{t:2,k:'c',d:.4},{t:2.5,k:'5',d:.5},{t:3,k:'c',d:.4}] },
  '9_8':       { name: '9/8', sig: '9/8', b: 4.5, p: [{t:0,k:'b',d:.9},{t:.5,k:'c',d:.4},{t:1,k:'c',d:.4},{t:1.5,k:'5',d:.9},{t:2,k:'c',d:.4},{t:2.5,k:'c',d:.4},{t:3,k:'b',d:.9},{t:3.5,k:'c',d:.4},{t:4,k:'c',d:.4}] }
};

let currentStyleKey = 'swing';
let melNotes = [];
let gridData = Array.from({ length: MAX_MEASURES }, () => ({
  splits: 1,
  chords: [{ root: 0, type: 'maj' }, { root: 0, type: 'maj' }, { root: 0, type: 'maj' }, { root: 0, type: 'maj' }]
}));

const gridEl = document.getElementById('measures-grid');
const mCnt = document.getElementById('meas-count');
const bpmIn = document.getElementById('bpm-input');
const sigSel = document.getElementById('sig-select');
const fileNameIn = document.getElementById('file-name');
const activeStyleLbl = document.getElementById('active-style-lbl');
const statusEl = document.getElementById('status');

function getSig() {
  const p = sigSel.value.split('/');
  const num = Number(p[0]), den = Number(p[1]);
  return { num, den, bpmMeas: num * (4 / den) };
}

function getMeasureCount() {
  const val = parseInt(mCnt.value, 10);
  if (isNaN(val) || val < 1) return 1;
  return Math.min(MAX_MEASURES, val);
}

function syncMeasuresToMelody() {
  if (melNotes.length === 0) return;
  const sig = getSig();
  const maxB = Math.max(...melNotes.map(n => n.start + n.dur));
  const needed = Math.max(1, Math.min(MAX_MEASURES, Math.ceil((maxB - 0.01) / sig.bpmMeas)));
  mCnt.value = needed;
}

const catSelects = document.querySelectorAll('.style-cat');
catSelects.forEach(sel => {
  sel.onchange = () => {
    if (!sel.value) return;
    currentStyleKey = sel.value;
    catSelects.forEach(other => { if (other !== sel) other.value = ''; });
    const stObj = STYLES[currentStyleKey];
    if (stObj) {
      activeStyleLbl.textContent = `Style : ${stObj.name}`;
      if (stObj.sig) {
        sigSel.value = stObj.sig;
        syncMeasuresToMelody();
      }
    }
    renderGrid();
  };
});

sigSel.onchange = () => {
  syncMeasuresToMelody();
  renderGrid();
};

mCnt.oninput = renderGrid;
mCnt.onchange = () => {
  mCnt.value = getMeasureCount();
  renderGrid();
};

// Copie flexible de la mesure (a) à la mesure (b) pour coller en (c)
document.getElementById('btn-copy-range').onclick = () => {
  const a = parseInt(document.getElementById('copy-from').value, 10);
  const b = parseInt(document.getElementById('copy-to').value, 10);
  const c = parseInt(document.getElementById('copy-dest').value, 10);

  if (isNaN(a) || isNaN(b) || isNaN(c) || a < 1 || b < 1 || c < 1) {
    statusEl.textContent = "Erreur : veuillez indiquer des numéros de mesures valides (≥ 1).";
    return;
  }
  if (a > b) {
    statusEl.textContent = `Erreur : la mesure de début (${a}) doit être inférieure ou égale à la mesure de fin (${b}).`;
    return;
  }
  const len = b - a + 1;
  if (c + len - 1 > MAX_MEASURES) {
    statusEl.textContent = `Erreur : la copie dépasse la limite maximale de ${MAX_MEASURES} mesures.`;
    return;
  }

  const slice = [];
  for (let i = a - 1; i <= b - 1; i++) {
    slice.push(JSON.parse(JSON.stringify(gridData[i])));
  }
  for (let i = 0; i < slice.length; i++) {
    gridData[(c - 1) + i] = slice[i];
  }

  const endDest = c + len - 1;
  if (endDest > getMeasureCount()) {
    mCnt.value = endDest;
  }

  renderGrid();
  statusEl.textContent = `Mesures ${a} à ${b} copiées et collées à partir de la mesure ${c} (jusqu'à M${endDest}) !`;
};

function renderGrid() {
  const count = getMeasureCount();
  const sig = getSig();
  gridEl.innerHTML = '';

  for (let m = 0; m < count; m++) {
    const item = gridData[m];
    if (!Array.isArray(item.chords)) {
      item.chords = [{ root: 0, type: 'maj' }, { root: 0, type: 'maj' }, { root: 0, type: 'maj' }, { root: 0, type: 'maj' }];
    }
    const card = document.createElement('div');
    card.className = 'm-card';
    card.id = `m-card-${m}`;

    const head = document.createElement('div');
    head.className = 'm-head';
    head.innerHTML = `<span class="m-num">Mesure ${m + 1}</span>`;

    const tools = document.createElement('div');
    tools.style.display = 'flex';
    tools.style.gap = '4px';
    tools.style.alignItems = 'center';

    if (m > 0) {
      const cp = document.createElement('button');
      cp.className = 'copy-btn';
      cp.textContent = 'Idem';
      cp.title = 'Recopier la mesure précédente';
      cp.onclick = () => { gridData[m] = JSON.parse(JSON.stringify(gridData[m - 1])); renderGrid(); };
      tools.appendChild(cp);
    }

    const spWrap = document.createElement('div');
    spWrap.className = 'split-btns';
    [1, 2, 3, 4].forEach(sp => {
      const b = document.createElement('button');
      b.className = `split-btn ${item.splits === sp ? 'active' : ''}`;
      b.textContent = sp;
      b.onclick = () => { item.splits = sp; renderGrid(); };
      spWrap.appendChild(b);
    });
    tools.appendChild(spWrap);
    head.appendChild(tools);
    card.appendChild(head);

    const slotsEl = document.createElement('div');
    slotsEl.className = 'slots';
    const step = sig.bpmMeas / item.splits;

    for (let s = 0; s < item.splits; s++) {
      if (!item.chords[s]) item.chords[s] = { root: 0, type: 'maj' };
      const row = document.createElement('div');
      row.className = 'slot-row';
      const lbl = document.createElement('span');
      lbl.className = 'slot-lbl';

      if (item.splits === 1) {
        lbl.textContent = 'Tout';
      } else if (sig.den === 8) {
        const eighthPos = Math.round(s * (sig.num / item.splits) * 10) / 10 + 1;
        lbl.textContent = `Cr.${eighthPos}`;
      } else {
        lbl.textContent = `T.${Math.round((s * step + 1) * 10) / 10}`;
      }

      const sR = document.createElement('select');
      ROOTS.forEach((rn, ri) => {
        const o = document.createElement('option');
        o.value = ri; o.textContent = rn;
        if (item.chords[s].root === ri) o.selected = true;
        sR.appendChild(o);
      });
      sR.onchange = () => { item.chords[s].root = parseInt(sR.value, 10); };

      const sT = document.createElement('select');
      TYPES.forEach(to => {
        const o = document.createElement('option');
        o.value = to.id; o.textContent = to.label;
        if (item.chords[s].type === to.id) o.selected = true;
        sT.appendChild(o);
      });
      sT.onchange = () => { item.chords[s].type = sT.value; };

      row.appendChild(lbl); row.appendChild(sR); row.appendChild(sT);
      slotsEl.appendChild(row);
    }
    card.appendChild(slotsEl);
    gridEl.appendChild(card);
  }
}

function parseChordText(raw) {
  const txt = raw.trim().replace(/\s+/g, '');
  if (!txt) return null;
  const m = txt.match(/^(Do|Ré|Re|Mi|Fa|Sol|La|Si|[A-G])([#b♯♭]?)(.*)$/i);
  if (!m) return null;

  const baseMap = { do:0, c:0, ré:2, re:2, d:2, mi:4, e:4, fa:5, f:5, sol:7, g:7, la:9, a:9, si:11, b:11 };
  let root = baseMap[m[1].toLowerCase()];
  if (root === undefined) return null;

  const acc = m[2];
  if (acc === '#' || acc === '♯') root = (root + 1) % 12;
  if (acc === 'b' || acc === '♭') root = (root + 11) % 12;

  const qual = (m[3] || '').toLowerCase();
  let type = 'maj';
  if (qual.includes('dim') || qual.includes('o') || qual.includes('°')) type = 'dim';
  else if (qual.startsWith('m') && !qual.startsWith('maj')) type = 'min';
  else if (qual.includes('7')) type = '7th';

  return { root, type };
}

document.getElementById('midi-in').onchange = async (e) => {
  const file = e.target.files.item(0);
  if (!file) return;
  try {
    const baseName = file.name.replace(/\.(mid|midi)$/i, '');
    fileNameIn.value = baseName + '_arrange';

    const res = parseMidiFile(await file.arrayBuffer());
    melNotes = res.notes;
    bpmIn.value = Math.round(res.bpm);
    const sigStr = `${res.num}/${res.den}`;
    if (Array.from(sigSel.options).some(o => o.value === sigStr)) sigSel.value = sigStr;

    const sig = getSig();
    const maxB = melNotes.length ? Math.max(...melNotes.map(n => n.start + n.dur)) : sig.bpmMeas * 8;
    const nMeas = Math.max(1, Math.min(MAX_MEASURES, Math.ceil((maxB - 0.01) / sig.bpmMeas)));
    mCnt.value = nMeas;

    let foundChords = 0;
    if (res.chords.length > 0) {
      let lastChord = { root: 0, type: 'maj' };
      for (let m = 0; m < nMeas; m++) {
        const mStart = m * sig.bpmMeas;
        const mEnd = (m + 1) * sig.bpmMeas;
        const inMeas = res.chords.filter(c => c.beat >= mStart - 0.05 && c.beat < mEnd - 0.05);

        if (inMeas.length > 0) {
          foundChords += inMeas.length;
          const sp = Math.min(4, inMeas.length);
          gridData[m].splits = sp;
          for (let s = 0; s < sp; s++) {
            gridData[m].chords[s] = { root: inMeas[s].root, type: inMeas[s].type };
            lastChord = gridData[m].chords[s];
          }
        } else {
          gridData[m].splits = 1;
          gridData[m].chords[0] = { root: lastChord.root, type: lastChord.type };
        }
      }
    }
    renderGrid();
    statusEl.textContent = foundChords > 0
      ? `Importé "${file.name}" : ${melNotes.length} notes + ${foundChords} accords (${nMeas} mesures en ${sigSel.value}).`
      : `Importé "${file.name}" : ${melNotes.length} notes (${nMeas} mesures en ${sigSel.value}). Renseignez vos accords ci-dessous.`;
  } catch (err) {
    statusEl.textContent = `Erreur MIDI : ${err.message}`;
  }
};

function parseMidiFile(buf) {
  const v = new DataView(buf);
  const decoder = new TextDecoder('utf-8');
  let p = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(v.getUint8(p++)); return s; };
  const u32 = () => { const x = v.getUint32(p); p += 4; return x; };
  const u16 = () => { const x = v.getUint16(p); p += 2; return x; };
  const vlq = () => { let val = 0, b; do { b = v.getUint8(p++); val = (val << 7) | (b & 0x7f); } while (b & 0x80); return val; };

  if (str(4) !== 'MThd') throw new Error('Fichier MIDI non valide');
  u32(); u16();
  const nTrk = u16(), tpq = u16();
  let bpm = 110, num = 4, den = 4;
  let bestNotes = [];
  let chordMarkers = [];

  for (let t = 0; t < nTrk; t++) {
    if (str(4) !== 'MTrk') break;
    const end = p + u32();
    let tick = 0, runSt = 0;
    const active = new Map(), notes = [];

    while (p < end) {
      tick += vlq();
      let st = v.getUint8(p);
      if (st < 0x80) st = runSt; else { p++; runSt = st; }
      const cmd = st & 0xf0;

      if (cmd === 0x90 || cmd === 0x80) {
        const note = v.getUint8(p++), vel = v.getUint8(p++);
        if (cmd === 0x90 && vel > 0) active.set(note, { tick, vel });
        else if (active.has(note)) {
          const on = active.get(note); active.delete(note);
          notes.push({ midi: note, start: on.tick / tpq, dur: Math.max(0.1, (tick - on.tick) / tpq), vel: on.vel / 127 });
        }
      } else if (cmd === 0xa0 || cmd === 0xb0 || cmd === 0xe0) p += 2;
      else if (cmd === 0xc0 || cmd === 0xd0) p += 1;
      else if (st === 0xff) {
        const mType = v.getUint8(p++), len = vlq();
        if (mType === 0x51 && len === 3) {
          bpm = 60000000 / ((v.getUint8(p) << 16) | (v.getUint8(p + 1) << 8) | v.getUint8(p + 2));
        } else if (mType === 0x58 && len >= 2) {
          num = v.getUint8(p); den = Math.pow(2, v.getUint8(p + 1));
        } else if (mType >= 0x01 && mType <= 0x07) {
          const rawBytes = new Uint8Array(buf, p, len);
          const txt = decoder.decode(rawBytes);
          const parsed = parseChordText(txt);
          if (parsed) chordMarkers.push({ beat: tick / tpq, root: parsed.root, type: parsed.type });
        }
        p += len;
      } else if (st === 0xf0 || st === 0xf7) p += vlq();
    }
    if (notes.length > bestNotes.length) bestNotes = notes;
  }
  chordMarkers.sort((a, b) => a.beat - b.beat);
  return { notes: bestNotes, chords: chordMarkers, bpm, num, den };
}

function buildTracks() {
  const count = getMeasureCount();
  const sig = getSig();
  const st = STYLES[currentStyleKey] || STYLES.swing;
  const maxB = count * sig.bpmMeas;

  const tMel = melNotes
    .filter(n => n.start < maxB - 0.001)
    .map(n => ({ midi: n.midi, start: n.start, dur: Math.min(n.dur, maxB - n.start), vel: n.vel || 0.85 }));

  const tBass = [], tChords = [], tMarkers = [];
  const scale = sig.bpmMeas / st.b;

  for (let m = 0; m < count; m++) {
    const mStart = m * sig.bpmMeas;
    const item = gridData[m];
    const slotLen = sig.bpmMeas / item.splits;

    for (let s = 0; s < item.splits; s++) {
      const ch = item.chords[s] || { root: 0, type: 'maj' };
      const to = TYPES.find(x => x.id === ch.type) || TYPES[0];
      tMarkers.push({ beat: mStart + s * slotLen, text: `${ROOTS[ch.root]}${to.label}` });
    }

    st.p.forEach(ev => {
      const rel = ev.t * scale;
      if (rel >= sig.bpmMeas - 0.005) return;
      const absStart = mStart + rel;
      const sIdx = Math.min(item.splits - 1, Math.floor((rel + 0.0001) / slotLen));
      const ch = item.chords[sIdx] || { root: 0, type: 'maj' };
      const dur = Math.max(0.12, Math.min(ev.d * scale, (m + 1) * sig.bpmMeas - absStart));

      if (ev.k === 'b' || ev.k === '5' || ev.k === '3' || ev.k === '6' || ev.k === '7') {
        let iv = 0;
        if (ev.k === '5') iv = 7;
        else if (ev.k === '3') iv = (ch.type === 'min' || ch.type === 'dim') ? 3 : 4;
        else if (ev.k === '6') iv = 9;
        else if (ev.k === '7') iv = (ch.type === 'dim') ? 9 : 10;
        tBass.push({ midi: 36 + ((ch.root + iv) % 12), start: absStart, dur, vel: 0.85 });
      } else if (ev.k === 'c') {
        const to = TYPES.find(x => x.id === ch.type) || TYPES[0];
        to.iv.forEach(iv => tChords.push({ midi: 48 + ((ch.root + iv) % 12), start: absStart, dur, vel: 0.72 }));
      }
    });
  }
  return { tMel, tBass, tChords, tMarkers, count };
}

let actx = null, timers = [], playing = false;
const bPrev = document.getElementById('btn-preview'), bStop = document.getElementById('btn-stop');

function tone(ctx, midi, t0, dur, gVal, wave, decayMode = false) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = wave;
  o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);

  g.gain.setValueAtTime(0.001, t0);
  g.gain.linearRampToValueAtTime(gVal, t0 + 0.012);

  if (decayMode) {
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, gVal * 0.25), t0 + dur * 0.65);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.08);
  } else {
    g.gain.setValueAtTime(gVal * 0.85, t0 + Math.max(0.02, dur - 0.03));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.03);
  }

  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.09);
}

function stopPrev() {
  playing = false; timers.forEach(clearTimeout); timers = [];
  if (actx) { actx.close().catch(() => {}); actx = null; }
  document.querySelectorAll('.m-card').forEach(c => c.classList.remove('playing'));
  bPrev.disabled = false; bStop.disabled = true;
}
bStop.onclick = stopPrev;

function startPrev() {
  if (playing) stopPrev();
  const { tMel, tBass, tChords, count } = buildTracks();
  const bpm = Math.max(40, Math.min(240, parseInt(bpmIn.value, 10) || 110));
  const bSec = 60 / bpm, sig = getSig();
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const t0 = actx.currentTime + 0.08;
  playing = true; bPrev.disabled = true; bStop.disabled = false;

  // Mélodie = Piano | Basse = Basse acoustique | Accords = Guitare acoustique
  tMel.forEach(n => tone(actx, n.midi, t0 + n.start * bSec, n.dur * bSec, 0.22, 'triangle', true));
  tBass.forEach(n => tone(actx, n.midi, t0 + n.start * bSec, n.dur * bSec, 0.32, 'sine', true));
  tChords.forEach(n => tone(actx, n.midi, t0 + n.start * bSec, n.dur * bSec, 0.09, 'triangle', true));

  for (let m = 0; m < count; m++) {
    timers.push(setTimeout(() => {
      document.querySelectorAll('.m-card').forEach(c => c.classList.remove('playing'));
      const c = document.getElementById(`m-card-${m}`);
      if (c) { c.classList.add('playing'); c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    }, m * sig.bpmMeas * bSec * 1000));
  }
  timers.push(setTimeout(stopPrev, count * sig.bpmMeas * bSec * 1000 + 200));
}
bPrev.onclick = startPrev;

// Raccourci clavier Barre d'espacement pour Start / Stop
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    if (playing) {
      stopPrev();
    } else {
      startPrev();
    }
  }
});

document.getElementById('btn-export').onclick = () => {
  try {
    const { tMel, tBass, tChords, tMarkers, count } = buildTracks();
    const bpm = Math.max(40, Math.min(240, parseInt(bpmIn.value, 10) || 110));
    const sig = getSig(), tpq = 480;
    const encoder = new TextEncoder();

    const vlq = val => {
      val = Math.max(0, Math.floor(val));
      const b = [val & 0x7f];
      while ((val >>= 7) > 0) b.unshift((val & 0x7f) | 0x80);
      return b;
    };

    const mkTrk = (notes, ch, prog, meta, markers) => {
      const evs = [];
      if (meta) {
        const us = Math.round(60000000 / bpm);
        evs.push({ t: 0, k: 0, d: [0xff, 0x51, 0x03, (us >> 16) & 0xff, (us >> 8) & 0xff, us & 0xff] });
        evs.push({ t: 0, k: 0, d: [0xff, 0x58, 0x04, sig.num, Math.round(Math.log2(sig.den)), 24, 8] });
      }
      if (markers && markers.length > 0) {
        markers.forEach(mk => {
          const tk = Math.max(0, Math.round(mk.beat * tpq));
          const txtBytes = Array.from(encoder.encode(mk.text));
          evs.push({ t: tk, k: 0, d: [0xff, 0x01, ...vlq(txtBytes.length), ...txtBytes] });
        });
      }
      evs.push({ t: 0, k: 0, d: [0xc0 | ch, prog] });
      notes.forEach(n => {
        const t1 = Math.max(0, Math.round(n.start * tpq));
        const t2 = Math.max(t1 + 10, Math.round((n.start + n.dur) * tpq));
        evs.push({ t: t1, k: 2, d: [0x90 | ch, n.midi & 0x7f, Math.max(1, Math.min(127, Math.round(n.vel * 127)))] });
        evs.push({ t: t2, k: 1, d: [0x80 | ch, n.midi & 0x7f, 0] });
      });
      evs.sort((a, b) => (a.t - b.t) || ((a.k || 0) - (b.k || 0)));
      const body = [];
      let last = 0;
      evs.forEach(e => { body.push(...vlq(e.t - last), ...e.d); last = e.t; });
      body.push(0x00, 0xff, 0x2f, 0x00);
      const len = body.length;
      return [0x4d, 0x54, 0x72, 0x6b, (len >> 24) & 0xff, (len >> 16) & 0xff, (len >> 8) & 0xff, len & 0xff, ...body];
    };

    // Piste 1 : Piano (0) | Piste 2 : Basse acoustique (32) | Piste 3 : Guitare acoustique (24)
    const t1 = mkTrk(tMel, 0, 0, true, tMarkers);
    const t2 = mkTrk(tBass, 1, 32, false, null);
    const t3 = mkTrk(tChords, 2, 24, false, null);
    const hdr = [0x4d, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 1, 0, 3, (tpq >> 8) & 0xff, tpq & 0xff];
    const midiBytes = new Uint8Array([...hdr, ...t1, ...t2, ...t3]);

    let rawName = (fileNameIn.value || '').trim();
    if (!rawName) rawName = `arrangement_${currentStyleKey}_${bpm}bpm`;
    rawName = rawName.replace(/[\/:*?"<>|]/g, '_');
    const finalName = rawName.toLowerCase().endsWith('.mid') ? rawName : rawName + '.mid';

    const blob = new Blob([midiBytes], { type: 'audio/midi' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = finalName;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 2000);

    statusEl.textContent = `Fichier "${finalName}" téléchargé (${count} mesures en ${sigSel.value} — Piano, Basse acoustique, Guitare acoustique) !`;
  } catch (err) {
    statusEl.textContent = `Erreur lors de la création MIDI : ${err.message}`;
  }
};

renderGrid();
</script>
</body>
</html>
